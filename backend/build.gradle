plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}
group = 'com.puppyruby'
version = '0.2.0'
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation platform('software.amazon.awssdk:bom:2.54.15')
    implementation 'software.amazon.awssdk:s3'
    runtimeOnly 'org.postgresql:postgresql:42.7.12'
    testRuntimeOnly 'com.h2database:h2:2.3.232'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
tasks.named('test') {
    useJUnitPlatform()
    setEnvironment(getEnvironment().findAll { key, value -> !(key in [
        'SPRING_DATASOURCE_URL', 'SPRING_DATASOURCE_USERNAME', 'SPRING_DATASOURCE_PASSWORD',
        'SPRING_FLYWAY_URL', 'SPRING_FLYWAY_USER', 'SPRING_FLYWAY_PASSWORD',
        'SPRING_CONFIG_LOCATION', 'SPRING_CONFIG_ADDITIONAL_LOCATION', 'SPRING_CONFIG_IMPORT',
        'DB_URL', 'DB_USERNAME', 'DB_PASSWORD'
    ]) })
    // Service tests manage disposable H2 schemas themselves. Migration tests opt in explicitly.
    environment 'SPRING_FLYWAY_ENABLED', 'false'
    environment 'DB_USERNAME', 'sa'
    environment 'DB_PASSWORD', ''
    environment 'DB_SCHEMA', ''
    environment 'S3_UPLOAD_ENABLED', 'false'
    environment 'MAIL_ENABLED', 'false'
}

def supportedBootRunSettings = [
    'PORT', 'SERVER_ADDRESS', 'PUBLIC_SITE_URL', 'ADMIN_EMAIL',
    'DB_URL', 'DB_USERNAME', 'DB_PASSWORD', 'DB_SCHEMA', 'DB_POOL_MAX_SIZE', 'DB_POOL_MIN_IDLE', 'FLYWAY_ENABLED',
    'KAKAO_REST_API_KEY', 'KAKAO_CLIENT_SECRET',
    'MAIL_ENABLED', 'MAIL_HOST', 'MAIL_PORT', 'MAIL_USERNAME', 'MAIL_PASSWORD', 'MAIL_FROM', 'MAIL_STARTTLS',
    'TOSS_CLIENT_KEY', 'TOSS_SECRET_KEY', 'TOSS_LIVE_ENABLED',
    'S3_UPLOAD_ENABLED', 'S3_BUCKET', 'AWS_REGION', 'S3_KEY_PREFIX', 'CDN_BASE_URL', 'CDN_ORIGIN_PATH',
    'S3_PRESIGN_TTL_SECONDS', 'S3_MAX_UPLOAD_BYTES', 'AWS_ACCESS_KEY_ID', 'AWS_SECRET_ACCESS_KEY', 'AWS_SESSION_TOKEN'
] as Set

def readBootRunEnvironment = {
    def settings = [:]
    ['.env', '.env.local'].each { configName ->
        def configFile = file(configName)
        if (!configFile.isFile()) return
        configFile.eachLine('UTF-8') { rawLine, lineNumber ->
            def line = rawLine.trim()
            if (!line || line.startsWith('#')) return
            def separator = line.indexOf('=')
            if (separator < 1) throw new GradleException("${configName}:${lineNumber}: invalid backend environment entry")
            def name = line.substring(0, separator).trim()
            if (!(name ==~ /[A-Za-z_][A-Za-z0-9_]*/)) {
                throw new GradleException("${configName}:${lineNumber}: invalid backend environment variable name")
            }
            if (!(name in supportedBootRunSettings)) {
                throw new GradleException("${configName}:${lineNumber}: unsupported backend setting ${name}")
            }
            def value = line.substring(separator + 1).trim()
            if (value.length() >= 2 && ((value.startsWith('"') && value.endsWith('"')) ||
                (value.startsWith("'") && value.endsWith("'")))) {
                value = value.substring(1, value.length() - 1)
            }
            settings[name] = value
        }
    }
    settings
}

tasks.named('bootRun') {
    doFirst {
        def localSettings = readBootRunEnvironment()
        environment localSettings
        def databaseUrl = localSettings.containsKey('DB_URL') ? localSettings.DB_URL : System.getenv('DB_URL')
        def databaseUsername = localSettings.containsKey('DB_USERNAME') ? localSettings.DB_USERNAME : System.getenv('DB_USERNAME')
        if (!databaseUrl?.trim() || !databaseUsername?.trim()) {
            throw new GradleException('DB_URL and DB_USERNAME are required. Create backend/.env from .env.example or provide them to this process.')
        }
    }
}

sourceSets {
    dbTools {
        java.srcDir 'src/dbTools/java'
        compileClasspath += sourceSets.main.output + configurations.runtimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

tasks.register('database', JavaExec) {
    group = 'database'
    description = 'Database Info, Validate, or explicit version-1 Baseline without starting the application.'
    dependsOn tasks.named('dbToolsClasses')
    classpath = sourceSets.dbTools.runtimeClasspath
    mainClass = 'com.puppyruby.dbtools.DatabaseTool'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    args providers.gradleProperty('dbAction').getOrElse('Info'),
        sourceSets.main.output.classesDirs.singleFile.absolutePath,
        providers.gradleProperty('baselineVersion').getOrElse('')
}
tasks.named('processResources') {
    from('../shared') { include 'commands.json' }
}
