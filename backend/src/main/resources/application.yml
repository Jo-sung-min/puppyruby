server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
spring:
  application:
    name: puppyruby-api
  datasource:
    # The service database must always be selected explicitly. Falling back to a
    # leftover local H2 file can make Flyway inspect the wrong PUBLIC schema.
    url: ${DB_URL}
    embedded-database-connection: none
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration/{vendor}
    baseline-on-migrate: false
    clean-disabled: true
    validate-on-migrate: true
    validate-migration-naming: true
    fail-on-missing-locations: true
management:
  endpoints:
    web:
      exposure:
        include: health
server.error.include-message: never
logging:
  level:
    # JDBC URLs can contain credentials supplied by a database hosting provider.
    org.flywaydb.core.FlywayExecutor: WARN
    org.hibernate.orm.connections.pooling: WARN
